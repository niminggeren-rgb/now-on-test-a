name: crown-lab
on:
  push:
    branches: [main]
    paths: ['crown-lab/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: crown-lab, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # 課のJSONから高品質ナレーションを生成
      - run: pip install edge-tts && python crown-lab/tools/make_audio.py && sh crown-lab/tools/build.sh
      - name: 生成した音声をコミット
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add crown-lab/audio crown-lab/index.html
          git diff --cached --quiet || (git commit -m "crown-lab: 音声を生成" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: crown-lab }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
